{% extends "base.html" %}
{% block title %}Vendors{% endblock %}
{% block content %}
<h1>Vendors</h1>
<form method="get" action="{{ url_for('vendors') }}" class="search" data-testid="vendor-search-form">
  <label for="q" class="sr">Search vendors</label>
  <input type="text" id="q" name="q" value="{{ q }}" placeholder="Search vendor name" data-testid="vendor-search">
  <button type="submit" class="btn" id="vendor-search-submit" data-testid="vendor-search-submit">Search</button>
</form>
<table id="vendors-table" data-testid="vendors-table" class="mail-table">
  <thead><tr><th>Vendor ID</th><th>Vendor Name</th><th>Status</th></tr></thead>
  <tbody>
  {% for v in vendors %}
    <tr id="vendor-row-{{ v.vendor_id }}" data-testid="vendor-row-{{ v.vendor_id }}">
      <td><a href="{{ url_for('vendor_detail', vendor_id=v.vendor_id) }}" data-testid="vendor-link-{{ v.vendor_id }}">{{ v.vendor_id }}</a></td>
      <td>{{ v.name }}</td>
      <td><span class="pill {{ 'pill-ok' if v.status == 'Active' else 'pill-off' }}">{{ v.status }}</span></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% if not vendors %}<p id="vendors-empty" data-testid="vendors-empty" class="empty">No vendors found.</p>{% endif %}
{% endblock %}
