{% extends "base.html" %}
{% block title %}Invoices{% endblock %}
{% block content %}
<h1>Invoices</h1>
<form method="get" action="{{ url_for('invoices') }}" class="search" data-testid="filter-form">
  <label for="vendor_id" class="sr">Vendor</label>
  <select id="vendor_id" name="vendor_id" data-testid="filter-vendor">
    <option value="">All vendors</option>
    {% for v in vendors %}<option value="{{ v.vendor_id }}" {{ 'selected' if v.vendor_id == selected }}>{{ v.name }}</option>{% endfor %}
  </select>
  <button type="submit" class="btn" id="filter-submit" data-testid="filter-submit">Filter</button>
  <a href="{{ url_for('invoice_new') }}" class="btn btn-ghost spacer-left">+ New invoice</a>
</form>
<p class="sortbar"><span id="invoice-count" data-testid="invoice-count">{{ invoices|length }} invoice{{ '' if invoices|length == 1 else 's' }}</span></p>
{% include "_invoice_table.html" %}
{% if not invoices %}<p id="invoices-empty" data-testid="invoices-empty" class="empty">No invoices found.</p>{% endif %}
{% endblock %}
